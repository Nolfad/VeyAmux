# Build main/PR artifacts. A version tag or a main commit titled "Release v1.2.3" publishes its assets.
name: AppImage

on:
  push:
    branches: [main]
    tags: ['VeyAmux-V.*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select release tag
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          tag=
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag=$GITHUB_REF_NAME
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            title=${COMMIT_MESSAGE%%$'\n'*}
            if [[ "$title" =~ ^Release\ (v[0-9]+(\.[0-9]+)+([-+][0-9A-Za-z.-]+)?)$ ]]; then
              tag=${BASH_REMATCH[1]}
            fi
          fi

          if [[ -n "$tag" ]]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            version=${tag#VeyAmux-V.}
            version=${version#v}
            if [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.release.outputs.version }}

  publish:
    needs: appimage
    if: needs.appimage.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: veyamux-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: VeyAmux-x86_64.AppImage
          path: dist

      - name: Check whether this build is still current
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          echo "promote=$([[ "$tip" == "$GITHUB_SHA" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.appimage.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(needs.appimage.outputs.tag, 'VeyAmux-') && needs.appimage.outputs.tag || format('VeyAmux {0}', needs.appimage.outputs.tag) }}
          fail_on_unmatched_files: true
          make_latest: ${{ steps.latest.outputs.promote }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/VeyAmux-x86_64.AppImage
            dist/VeyAmux-x86_64.AppImage.zsync
