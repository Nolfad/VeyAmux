# Builds VeyAmux-x86_64.AppImage (+ .zsync for automatic updates) on GitHub.
# - Every push to main / pull request: build and keep the AppImage as a workflow artifact (Actions tab).
# - Push a version tag or a main commit titled "Release v1.2.3" to publish both files.
name: AppImage

on:
  push:
    branches: [main]
    tags: ['VeyAmux-V.*', 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC: .          # folder with CMakeLists.txt / scripts (linux in the Veyra fork)

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config patchelf file python3 curl glslang-tools zsync \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-svg-dev qt6-wayland qt6-shader-baker \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            libvulkan-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libva-dev libpipewire-0.3-dev \
            libssl-dev libcurl4-openssl-dev libjson-c-dev libminiupnpc-dev libevent-dev libopus-dev

      - name: Build AppImage
        working-directory: ${{ env.SRC }}
        env:
          # updates come from this repository's releases
          VEYAMUX_UPDATE_INFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|VeyAmux-x86_64.AppImage.zsync
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VeyAmux-x86_64.AppImage
          path: |
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage.zsync

      - name: Select release tag
        id: release
        if: github.event_name == 'push'
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == main ]]; then
            title=${COMMIT_MESSAGE%%$'\n'*}
            if [[ "$title" =~ ^Release\ (v[0-9]+(\.[0-9]+)+([-+][0-9A-Za-z.-]+)?)$ ]]; then
              echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish release
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(steps.release.outputs.tag, 'VeyAmux-') && steps.release.outputs.tag || format('VeyAmux {0}', steps.release.outputs.tag) }}
          fail_on_unmatched_files: true
          make_latest: true
          # the description: RELEASE_NOTES.md (what is new), then GitHub's generated changelog link
          body_path: ${{ env.SRC }}/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage
            ${{ env.SRC }}/dist/VeyAmux-x86_64.AppImage.zsync
